<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVER 회원가입</title>
    <link rel="stylesheet" href="naver.css">
</head>
<body>
  <div class="N">
    <h1>NAVER</h1>
    <p>실명 인증된 아이디로 가입</p>

    <input type="text" placeholder="아이디">
    <input type="text" placeholder="비밀번호">
    <input type="text" placeholder="이메일주소">
    <input type="text" placeholder="이름">
    <input type="text" placeholder="생년월일 8자리">

    <input type="text" list="telecom" placeholder="통신사 선택">
    <datalist id="telecom">
    <option value="SKT">
    <option value="KT">
    <option value="LG U+">
    </datalist>

   <div class="gender">
    <button>여자</button>
    <button>남자</button>
    <button>외국인</button>
    <button>내국인</button>
    </div>

    <input type="text" placeholder="휴대전화번호">
    <input type="text" placeholder="인증 약관 전체동의">
    <button>인증요청</button>
    </div>
  </div>
</body>
</html>
